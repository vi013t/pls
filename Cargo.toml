[package]
name = "cd-pls"
description = "A pretty ls-like command for listing files."
license = "MIT"
authors = ["Violet Iapalucci"]
version = "0.1.11"
edition = "2021"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.18", features = ["derive"] }
colored = "3.0.0"
devicons = "0.6.12"
globset = "0.4.16"
serde = { version = "1.0.228", features = ["derive"] }
serde-inline-default = "1.0.0"
shellexpand = "3.1.1"
toml = "0.9.7"

[[bin]]
path = "src/main.rs"
name = "pls"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
